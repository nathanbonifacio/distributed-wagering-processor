services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Fixe a tag após validar no seu ambiente (ver ARCHITECTURE.md: licenciamento/token).
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      # Só fica saudável depois que o script de init terminou (filas criadas).
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    command: ["bun", "run", "migration:up"]
    environment: &app-env
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    command: ["bun", "run", "start:api"]
    environment: *app-env
    ports: ["3000-3009:3000"]   # faixa permite `docker compose up --scale api=3`
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }

  worker:
    build: .
    command: ["bun", "run", "start:worker"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
